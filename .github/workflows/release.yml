name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(sed -nE 's/^project\(kde-headphones VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
            exit 1
          fi

  arch:
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel cmake ninja git qt6-base bluez-libs dbus gettext
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          useradd -m builder
          git config --system --add safe.directory '*'
          mkdir /home/builder/pkg
          cp packaging/arch/PKGBUILD /home/builder/pkg/
          cd /home/builder/pkg
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          sed -i "s|\"git+\$url.git#tag=v\$pkgver\"|\"kde-headphones::git+file://$GITHUB_WORKSPACE#commit=$GITHUB_SHA\"|" PKGBUILD
          chown -R builder: /home/builder/pkg
          chmod -R a+rX "$GITHUB_WORKSPACE"
          su builder -c 'makepkg --nodeps --noconfirm'
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find . -maxdepth 1 -name '*.pkg.tar.zst' ! -name '*-debug-*' -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  debian:
    needs: version
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build git ca-certificates \
            qt6-base-dev libbluetooth-dev libdbus-1-dev gettext dpkg-dev file
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build package
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          cd build && cpack -G DEB
      - uses: actions/upload-artifact@v4
        with:
          name: debian
          path: build/*.deb

  fedora:
    needs: version
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install dependencies
        run: dnf install -y gcc-c++ cmake ninja-build git qt6-qtbase-devel bluez-libs-devel dbus-devel gettext rpm-build
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build package
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          cd build && cpack -G RPM
      - uses: actions/upload-artifact@v4
        with:
          name: fedora
          path: build/*.rpm

  release:
    if: github.ref_type == 'tag'
    needs: [arch, debian, fedora]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  aur:
    if: github.ref_type == 'tag'
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: key
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$AUR_KEY" ]; then echo present=true; else echo present=false; fi >> "$GITHUB_OUTPUT"
      - name: Set version
        if: steps.key.outputs.present == 'true'
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ needs.version.outputs.version }}/; s/^pkgrel=.*/pkgrel=1/" packaging/arch/PKGBUILD
      - name: Publish to the AUR
        if: steps.key.outputs.present == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: kde-headphones
          pkgbuild: packaging/arch/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ needs.version.outputs.version }}
